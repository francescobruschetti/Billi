# Note: Run "dart run flutter_native_splash:create --path=flutter_native_splash_screen.yml" to generate splash screen
flutter_native_splash:
  android: true
  ios: true
  web: true

  # background_image: assets/images/splash_screen/splash_screen_image_v1.png
  color: "#D4E4F4"
  image: assets/images/splash_screen/splash_screen_image_v1.png
  branding: assets/images/splash_screen/splash_screen_brand.png

  # background_image_dark: assets/images/splash_screen/splash_screen_image_v1.png
  color_dark: "#000000"
  image_dark: assets/images/splash_screen/splash_screen_image_v1.png
  branding_dark: assets/images/splash_screen/splash_screen_brand.png

  android_12:
    color: "#D4E4F4"
    image: assets/images/splash_screen/splash_screen_image_v1.png
    branding: assets/images/splash_screen/splash_screen_brand.png